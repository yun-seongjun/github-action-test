# node_modules 캐시 미리 저장
# - PR 실행에서 저장한 캐시는 그 PR 안에서만 쓰여서, 새 PR의 첫 실행은 매번 캐시 없이 설치함
# - dev/main에 저장한 캐시는 그 브랜치로 가는 모든 PR이 복원할 수 있으므로, 의존성이 바뀔 때 미리 저장
# - path/key는 ci.yml의 "Restore node_modules cache"와 동일하게 유지해야 함
name: Node Modules Cache

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'yarn.lock'
      - '.nvmrc'
      - '.github/workflows/node-modules-cache.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  save-node-modules-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'yarn.lock') }}

      # 캐시가 없을 때만 설치 (설치 후 job 종료 시 캐시 저장)
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
