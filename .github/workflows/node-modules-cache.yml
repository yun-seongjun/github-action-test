# node_modules 캐시 미리 저장 워크플로우
# - PR에서 저장한 캐시는 그 PR 안에서만 쓰여서, 새 PR의 첫 실행은 매번 캐시 없이 설치함
# - dev/main에 저장한 캐시는 그 브랜치로 가는 모든 PR이 쓸 수 있으므로, 의존성이 바뀔 때 미리 저장
# - path/key는 ci.yml의 "Restore node_modules cache"와 동일하게 유지해야 함
name: Node Modules Cache

on:
  push:
    branches:
      - dev
      - main
    # 캐시 key가 바뀌는 파일 + 이 워크플로우 자체 (처음 머지될 때 캐시 생성)
    paths:
      - 'yarn.lock'
      - '.nvmrc'
      - 'apps/*/package.json'
      - 'libs/*/package.json'
      - '.github/workflows/node-modules-cache.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  save-node-modules-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node.js 버전은 .nvmrc 파일에서 관리
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # yarn 캐시 대신 node_modules를 직접 캐시
          package-manager-cache: false

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'yarn.lock', 'apps/*/package.json', 'libs/*/package.json') }}

      # 캐시가 없을 때만 설치 (job 종료 시 캐시 저장)
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
